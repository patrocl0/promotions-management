services:
  mongodb:
    image: mongo:8
    container_name: kodigo-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "db.adminCommand(''ping'').ok" | grep 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kodigo-backend
    restart: unless-stopped

    environment:
      PORT: ${PORT}
      MONGO_URI: mongodb://admin:${MONGO_ROOT_PASSWORD}@mongodb:27017/promotions_db?authSource=admin

    ports:
      - "${PORT}:${PORT}"

    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
