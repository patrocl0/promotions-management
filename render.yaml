services:
  - type: web
    name: promotions-management-api
    runtime: node
    rootDir: backend-kodigo
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
